/* HTML */
<main class="dashboard" aria-label="Equipment Admin Dashboard">
  <header class="dashboard__header">
    <div class="dashboard__title">
      <h1>Equipment Dashboard</h1>
      <p class="dashboard__subtitle">Operational overview and today’s activity.</p>
    </div>
    <div class="dashboard__meta" aria-label="Dashboard status">
      <span class="pill" aria-label="Date">Today</span>
      <span class="pill pill--dark" aria-label="Last updated">Updated 09:42</span>
    </div>
  </header>

  <section class="dashboard__section" aria-labelledby="kpi-title">
    <div class="section__head">
      <h2 id="kpi-title">Key metrics</h2>
    </div>

    <div class="kpi-grid">
      <article class="card kpi" aria-label="Total equipment">
        <div class="kpi__head">
          <h3 class="kpi__label">Total equipment</h3>
          <span class="kpi__badge" aria-hidden="true">All</span>
        </div>
        <p class="kpi__value">248</p>
        <p class="kpi__note">Across all categories.</p>
      </article>

      <article class="card kpi" aria-label="In-use equipment">
        <div class="kpi__head">
          <h3 class="kpi__label">In use</h3>
          <span class="kpi__badge kpi__badge--accent" aria-hidden="true">Active</span>
        </div>
        <p class="kpi__value">96</p>
        <p class="kpi__note">Checked out right now.</p>
      </article>

      <article class="card kpi" aria-label="Available equipment">
        <div class="kpi__head">
          <h3 class="kpi__label">Available</h3>
          <span class="kpi__badge kpi__badge--good" aria-hidden="true">Ready</span>
        </div>
        <p class="kpi__value">132</p>
        <p class="kpi__note">Ready for reservation.</p>
      </article>
